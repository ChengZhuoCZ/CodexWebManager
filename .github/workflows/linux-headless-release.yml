name: Linux headless release

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/linux-headless-release.yml"
      - "docs/linux-headless-release.md"
      - "packages/account-router/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.1

      - name: Select Node.js 22
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"

      - name: Assert native Linux runner
        shell: bash
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(node -p 'process.arch')" = "x64"

      - name: Test deterministic release builder
        run: node --test packages/account-router/test/linux-release.test.mjs

      - name: Build release archive
        run: >-
          node packages/account-router/scripts/build-linux-release.mjs
          --arch x64
          --output artifacts/x64

      - name: Install and run headlessly
        shell: bash
        run: |
          version=$(node -p "require('./packages/account-router/package.json').version")
          artifact="artifacts/x64/codex-account-router-${version}-linux-x64.tar.gz"
          node packages/account-router/scripts/verify-linux-release.mjs \
            --arch x64 \
            --artifact "$artifact" \
            --summary artifacts/x64/verification.json
          cat artifacts/x64/verification.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified archive and evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codex-account-router-linux-x64
          path: artifacts/x64/
          if-no-files-found: error
          compression-level: 0
