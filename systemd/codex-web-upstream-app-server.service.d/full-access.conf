[Service]
# 8215-only operator override. CLI config has the highest Codex precedence.
ExecStart=
ExecStart=/usr/local/bin/codex -c 'sandbox_mode="danger-full-access"' -c 'approval_policy="never"' -c features.code_mode_host=true app-server --analytics-default-enabled --listen unix:///run/codex-web-upstream-app-server/app-server.sock

# Remove the outer systemd restrictions that otherwise keep Codex read-only
# outside /srv/codex-workspaces. Unix ownership and mode bits still apply.
ReadWritePaths=
NoNewPrivileges=false
PrivateTmp=false
PrivateDevices=false
PrivateMounts=false
ProtectSystem=false
ProtectHome=false
RestrictSUIDSGID=false
RestrictAddressFamilies=
